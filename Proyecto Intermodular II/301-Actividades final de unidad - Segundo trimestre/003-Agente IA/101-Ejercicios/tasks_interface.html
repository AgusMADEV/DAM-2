<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Tareas - Generado por Ollama</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-delete {
            background: #e74c3c;
            padding: 8px 15px;
            font-size: 14px;
        }
        .btn-delete:hover {
            background: #c0392b;
        }
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .task-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
        }
        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .task-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .task-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .task-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-pendiente {
            background: #fff3cd;
            color: #856404;
        }
        .status-en_proceso {
            background: #d1ecf1;
            color: #0c5460;
        }
        .status-completada {
            background: #d4edda;
            color: #155724;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Sistema de Gestión de Tareas</h1>
        <p class="subtitle">🤖 Generado automáticamente por Ollama (qwen2.5-coder:7b)</p>
        
        <div id="alertContainer"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statPendiente">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statProceso">0</div>
                <div class="stat-label">En Proceso</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statCompletada">0</div>
                <div class="stat-label">Completadas</div>
            </div>
        </div>

        <div class="form-section">
            <h2>➕ Nueva Tarea</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" name="title" required placeholder="Nombre de la tarea">
                </div>
                <div class="form-group">
                    <label for="description">Descripción</label>
                    <textarea id="description" name="description" required placeholder="Detalles de la tarea"></textarea>
                </div>
                <div class="form-group">
                    <label for="status">Estado</label>
                    <select id="status" name="status">
                        <option value="pendiente">Pendiente</option>
                        <option value="en_proceso">En Proceso</option>
                        <option value="completada">Completada</option>
                    </select>
                </div>
                <button type="submit" class="btn">Crear Tarea</button>
            </form>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pendiente">Pendientes</button>
            <button class="filter-btn" data-filter="en_proceso">En Proceso</button>
            <button class="filter-btn" data-filter="completada">Completadas</button>
        </div>

        <div class="tasks-grid" id="tasksContainer">
            <p>Cargando tareas...</p>
        </div>
    </div>

    <script>
        const API_URL = 'tasks_api.php';
        let currentFilter = 'all';

        // Cargar tareas al inicio
        loadTasks();

        // Formulario de creación
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.message) {
                    showAlert('Tarea creada exitosamente', 'success');
                    e.target.reset();
                    loadTasks();
                } else if (data.error) {
                    showAlert(data.error, 'error');
                }
            } catch (error) {
                showAlert('Error al crear la tarea', 'error');
            }
        });

        // Filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                loadTasks();
            });
        });

        // Cargar tareas
        async function loadTasks() {
            try {
                let url = API_URL;
                if (currentFilter !== 'all') {
                    url += `?status=${currentFilter}`;
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.tasks) {
                    displayTasks(data.tasks);
                    updateStats(data.tasks);
                } else {
                    showAlert('Error al cargar tareas', 'error');
                }
            } catch (error) {
                showAlert('Error de conexión', 'error');
            }
        }

        // Mostrar tareas
        function displayTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            
            if (tasks.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#999;">No hay tareas para mostrar</p>';
                return;
            }
            
            container.innerHTML = tasks.map(task => `
                <div class="task-card">
                    <div class="task-status status-${task.status}">${getStatusLabel(task.status)}</div>
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    <div class="task-description">${escapeHtml(task.description)}</div>
                    <button class="btn btn-delete" onclick="deleteTask(${task.id})">🗑️ Eliminar</button>
                </div>
            `).join('');
        }

        // Actualizar estadísticas
        function updateStats(tasks) {
            document.getElementById('statTotal').textContent = tasks.length;
            document.getElementById('statPendiente').textContent = tasks.filter(t => t.status === 'pendiente').length;
            document.getElementById('statProceso').textContent = tasks.filter(t => t.status === 'en_proceso').length;
            document.getElementById('statCompletada').textContent = tasks.filter(t => t.status === 'completada').length;
        }

        // Eliminar tarea
        async function deleteTask(id) {
            if (!confirm('¿Eliminar esta tarea?')) return;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `id=${id}`
                });
                const data = await response.json();
                
                if (data.message) {
                    showAlert('Tarea eliminada', 'success');
                    loadTasks();
                } else {
                    showAlert(data.error || 'Error al eliminar', 'error');
                }
            } catch (error) {
                showAlert('Error de conexión', 'error');
            }
        }

        // Mostrar alertas
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 3000);
        }

        // Utilidades
        function getStatusLabel(status) {
            const labels = {
                'pendiente': 'Pendiente',
                'en_proceso': 'En Proceso',
                'completada': 'Completada'
            };
            return labels[status] || status;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
